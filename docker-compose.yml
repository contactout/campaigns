services:
    caddy:
        image: caddy:2-alpine
        restart: unless-stopped
        ports:
            - '${HTTP_PORT:-80}:80'
            - '${HTTPS_PORT:-443}:443'
            - '${HTTPS_PORT:-443}:443/udp'
        environment:
            DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
            ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
        volumes:
            - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            app:
                condition: service_healthy

    app:
        build: .
        image: campaigns:latest
        restart: unless-stopped
        env_file: .env
        environment:
            CONTAINER_ROLE: app
        volumes:
            - app_storage:/var/www/html/storage/app
            - app_logs:/var/www/html/storage/logs
        depends_on:
            mysql:
                condition: service_healthy
        expose:
            - '8080'
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8080/up']
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 90s

    queue:
        image: campaigns:latest
        restart: unless-stopped
        env_file: .env
        environment:
            CONTAINER_ROLE: queue
        command:
            [
                'php',
                'artisan',
                'queue:work',
                'database',
                '--sleep=1',
                '--tries=3',
                '--timeout=120',
                '--max-time=3600',
            ]
        volumes:
            - app_storage:/var/www/html/storage/app
            - app_logs:/var/www/html/storage/logs
        depends_on:
            app:
                condition: service_healthy
            mysql:
                condition: service_healthy

    scheduler:
        image: campaigns:latest
        restart: unless-stopped
        env_file: .env
        environment:
            CONTAINER_ROLE: scheduler
        command: ['php', 'artisan', 'schedule:work']
        volumes:
            - app_storage:/var/www/html/storage/app
            - app_logs:/var/www/html/storage/logs
        depends_on:
            app:
                condition: service_healthy
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-campaigns}
            MYSQL_USER: ${DB_USERNAME:-campaigns}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1',
                ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s

volumes:
    mysql_data:
    caddy_data:
    caddy_config:
    app_storage:
    app_logs:
